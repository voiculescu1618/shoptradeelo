<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Authorization Callback — Tradeelo</title>
<style>body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0d0d0d;color:#e0e0e0;max-width:600px;margin:0 auto;padding:40px 24px;}
h1{color:#fff;}.code{background:#1a1a1a;color:#6af;padding:16px;border-radius:8px;word-break:break-all;font-family:monospace;margin:20px 0;}
.copy{color:#888;font-size:.9rem;}a{color:#6af;}</style></head>
<body>
<h1>Authorization Callback</h1>
<p>Copy the authorization code below and send it to the app administrator.</p>
<div class="code" id="code">Loading...</div>
<p class="copy">This page automatically captures the authorization code from the URL.</p>
<script>
const params = new URLSearchParams(window.location.search);
const code = params.get('code');
if (code) document.getElementById('code').textContent = code;
else document.getElementById('code').textContent = 'No authorization code found.';
</script>
</body></html>
